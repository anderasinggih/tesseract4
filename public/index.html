<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER WARFARE OPS // GLOBAL THREAT MATRIX</title>
  
  <!-- MapLibre GL JS & CSS (mapcn Foundation) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  
  <!-- Professional Monospace Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080a0f;
      --panel-bg: rgba(12, 16, 24, 0.92);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-active: rgba(0, 255, 136, 0.4);
      --red-team: #ff2a5f;
      --blue-team: #00b4d8;
      --neon-green: #00e676;
      --text-muted: #8290a5;
      --text-main: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'JetBrains Mono', monospace;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #05070a;
    }

    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    /* Professional Cyber Header */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-green);
      border-radius: 50%;
    }

    .metrics-bar {
      display: flex;
      gap: 24px;
      font-size: 11px;
    }

    .metric-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .metric-title {
      color: var(--text-muted);
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .metric-val {
      font-weight: 700;
      font-size: 13px;
    }

    /* Structured Panels */
    .glass-panel {
      position: absolute;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      backdrop-filter: blur(10px);
      z-index: 10;
      padding: 14px;
    }

    #action-deck {
      top: 70px;
      left: 12px;
      width: 310px;
      max-height: calc(100vh - 84px);
      overflow-y: auto;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .faction-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .faction-btn {
      padding: 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: all 0.15s ease;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
    }

    .faction-btn.red-active {
      background: rgba(255, 42, 95, 0.12);
      border-color: var(--red-team);
      color: var(--red-team);
    }

    .faction-btn.blue-active {
      background: rgba(0, 180, 216, 0.12);
      border-color: var(--blue-team);
      color: var(--blue-team);
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 9px;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 7px 9px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--border-active);
    }

    .strike-btn {
      width: 100%;
      padding: 10px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .strike-btn-red {
      background: var(--red-team);
      color: #fff;
    }
    .strike-btn-red:hover { background: #e02454; }

    .strike-btn-blue {
      background: var(--blue-team);
      color: #05070a;
    }
    .strike-btn-blue:hover { background: #0096c7; }

    /* Right Telemetry & Matrix Terminal Feed */
    #telemetry-deck {
      top: 70px;
      right: 12px;
      width: 360px;
      max-height: calc(100vh - 84px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #terminal-stream {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px 10px;
      height: 220px;
      overflow-y: auto;
      font-size: 10px;
      line-height: 1.4;
    }

    .log-line {
      margin-bottom: 3px;
      word-break: break-all;
    }
    .log-WARN { color: var(--red-team); }
    .log-CRIT { color: #ff5722; font-weight: 700; }
    .log-DEFENSE { color: var(--blue-team); font-weight: 700; }
    .log-INFO { color: var(--neon-green); }

    /* Active Threat List */
    #intercept-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .threat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--red-team);
      border-radius: 3px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
    }

    .intercept-action-btn {
      padding: 4px 7px;
      background: var(--blue-team);
      color: #05070a;
      font-weight: 700;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 9px;
      letter-spacing: 0.5px;
    }
    .intercept-action-btn:hover { background: #0096c7; }

    /* Mobile Clean Layout */
    @media (max-width: 900px) {
      #top-bar { padding: 8px 10px; }
      .brand-title { font-size: 11px; }
      .metrics-bar { gap: 12px; font-size: 9px; }
      #action-deck {
        top: 56px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: 38vh;
      }
      #telemetry-deck {
        bottom: 8px;
        top: auto;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: 32vh;
      }
    }
  </style>
</head>
<body>

  <div id="map-container"></div>
  <canvas id="canvas-overlay"></canvas>

  <!-- Top Clean Metrics Bar -->
  <div id="top-bar">
    <div class="brand-title">
      <span class="status-dot"></span>
      CYBER WARFARE OPS // THREAT MATRIX
    </div>
    <div class="metrics-bar">
      <div class="metric-badge">
        <span class="metric-title">DEFCON LEVEL</span>
        <span class="metric-val" id="defcon-val" style="color: var(--red-team);">DEFCON 4</span>
      </div>
      <div class="metric-badge">
        <span class="metric-title">RED : BLUE SCORE</span>
        <span class="metric-val"><span id="red-score" style="color: var(--red-team);">0</span> : <span id="blue-score" style="color: var(--blue-team);">0</span></span>
      </div>
      <div class="metric-badge">
        <span class="metric-title">SHANNON ENTROPY</span>
        <span class="metric-val" id="entropy-val" style="color: var(--neon-green);">4.20 H(X)</span>
      </div>
    </div>
  </div>

  <!-- Left Control Deck -->
  <div id="action-deck" class="glass-panel">
    <div class="panel-header">
      <span>TACTICAL DECK</span>
      <span id="agent-id-badge" style="color: var(--blue-team);">SENTINEL-INIT</span>
    </div>

    <!-- Faction Selector -->
    <div class="faction-toggle">
      <div id="btn-faction-red" class="faction-btn red-active" onclick="setFaction('red')">RED TEAM [ATTACK]</div>
      <div id="btn-faction-blue" class="faction-btn" onclick="setFaction('blue')">BLUE TEAM [DEFEND]</div>
    </div>

    <div class="form-group">
      <label>OPERATOR ALIAS</label>
      <input type="text" id="operator-alias" class="form-control" value="Specter-01" onchange="syncAgentProfile()">
    </div>

    <div class="form-group">
      <label>STATION BASE</label>
      <select id="origin-city" class="form-control" onchange="syncAgentProfile()">
        <option value="Jakarta">Jakarta [ID] (AS131440)</option>
        <option value="Singapore">Singapore [SG] (AS4657)</option>
        <option value="Tokyo">Tokyo [JP] (AS2514)</option>
        <option value="Frankfurt">Frankfurt [DE] (AS8881)</option>
        <option value="Washington DC">Washington DC [US] (AS396982)</option>
        <option value="London">London [GB] (AS5459)</option>
        <option value="Sydney">Sydney [AU] (AS1221)</option>
        <option value="São Paulo">São Paulo [BR] (AS22548)</option>
        <option value="Seoul">Seoul [KR] (AS9318)</option>
        <option value="Zurich">Zurich [CH] (AS3303)</option>
        <option value="Hong Kong">Hong Kong [HK] (AS9381)</option>
        <option value="San Francisco">San Francisco [US] (AS13335)</option>
      </select>
    </div>

    <!-- Red Team Form -->
    <div id="red-controls">
      <div class="form-group">
        <label>TARGET NODE</label>
        <select id="target-city" class="form-control">
          <option value="Washington DC">Washington DC (199.19.0.1)</option>
          <option value="Tokyo">Tokyo (133.242.18.5)</option>
          <option value="Frankfurt">Frankfurt (194.109.6.99)</option>
          <option value="London">London (195.66.224.1)</option>
          <option value="Singapore">Singapore (165.21.100.2)</option>
          <option value="Jakarta">Jakarta (103.119.214.1)</option>
          <option value="Hong Kong">Hong Kong (202.45.84.1)</option>
        </select>
      </div>

      <div class="form-group">
        <label>EXPLOIT VECTOR</label>
        <select id="attack-vector" class="form-control">
          <option value="DDoS SYN Flood">DDoS SYN Flood (100 Gbps)</option>
          <option value="Ransomware Encryptor">Ransomware Payload (High Entropy)</option>
          <option value="Kernel 0-Day Exploit">Kernel Remote 0-Day Exploit</option>
          <option value="DNS Amplification">DNS Amplification Reflection</option>
        </select>
      </div>

      <div class="form-group">
        <label>BURST PAYLOAD: <span id="payload-display" style="color: var(--neon-green);">450 MB</span></label>
        <input type="range" id="payload-size" min="100" max="1000" step="50" value="450" class="form-control" oninput="document.getElementById('payload-display').innerText = this.value + ' MB'">
      </div>

      <button class="strike-btn strike-btn-red" onclick="launchCyberAttack()">LAUNCH ATTACK</button>
    </div>

    <!-- Blue Team Form -->
    <div id="blue-controls" style="display: none;">
      <div class="form-group">
        <label>FIREWALL NODE SHIELD</label>
        <select id="shield-target-city" class="form-control">
          <option value="Jakarta">Jakarta Grid</option>
          <option value="Washington DC">Washington DC Grid</option>
          <option value="Frankfurt">Frankfurt Core</option>
          <option value="Tokyo">Tokyo Gateway</option>
        </select>
      </div>
      <button class="strike-btn strike-btn-blue" onclick="deployNodeShield()">DEPLOY SHIELD</button>
    </div>
  </div>

  <!-- Right Telemetry Deck -->
  <div id="telemetry-deck" class="glass-panel">
    <div class="panel-header">
      <span>THREAT INTERCEPTION</span>
      <span id="active-arcs-count" style="color: var(--red-team);">0 ARCS</span>
    </div>
    <div id="intercept-list">
      <div style="color: var(--text-muted); font-size: 10px;">Scanning airspace for active attack arcs...</div>
    </div>

    <div class="panel-header" style="margin-top: 8px;">
      <span>TELEMETRY LOG STREAM</span>
      <span style="color: var(--neon-green);">30 FPS</span>
    </div>
    <div id="terminal-stream"></div>
  </div>

  <script>
    // 1. Initialize MapLibre GL Dark Map (mapcn Dark Styling)
    const map = new maplibregl.Map({
      container: 'map-container',
      style: {
        version: 8,
        sources: {
          'carto-dark': {
            type: 'raster',
            tiles: [
              'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
              'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
              'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'
            ],
            tileSize: 256,
            attribution: '© OpenStreetMap, © CARTO'
          }
        },
        layers: [
          {
            id: 'carto-dark-layer',
            type: 'raster',
            source: 'carto-dark',
            minzoom: 0,
            maxzoom: 19
          }
        ]
      },
      center: [20, 20],
      zoom: 1.8,
      attributionControl: false
    });

    // 2. Setup Canvas Overlay for High-Performance Geodesic Arc Rendering
    const canvas = document.getElementById('canvas-overlay');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 3. WebSocket Connection with War Room Actor Model Engine
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    let ws = null;
    let currentFaction = 'red';
    let selfAgentId = '';
    let warState = null;

    function connectWS() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        syncAgentProfile();
      };

      ws.onmessage = (event) => {
        try {
          warState = JSON.parse(event.data);
          renderWarRoomState(warState);
        } catch (e) {
          console.error("Frame parse error:", e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, 2000);
      };
    }
    connectWS();

    function setFaction(faction) {
      currentFaction = faction;
      document.getElementById('btn-faction-red').className = `faction-btn ${faction === 'red' ? 'red-active' : ''}`;
      document.getElementById('btn-faction-blue').className = `faction-btn ${faction === 'blue' ? 'blue-active' : ''}`;
      document.getElementById('red-controls').style.display = faction === 'red' ? 'block' : 'none';
      document.getElementById('blue-controls').style.display = faction === 'blue' ? 'block' : 'none';
      syncAgentProfile();
    }

    function syncAgentProfile() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const alias = document.getElementById('operator-alias').value;
      const city = document.getElementById('origin-city').value;
      ws.send(JSON.stringify({
        type: 'join',
        alias: alias,
        faction: currentFaction,
        city: city
      }));
    }

    function launchCyberAttack() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const targetCity = document.getElementById('target-city').value;
      const vector = document.getElementById('attack-vector').value;
      const payloadMB = parseInt(document.getElementById('payload-size').value, 10);

      ws.send(JSON.stringify({
        type: 'attack',
        targetCity: targetCity,
        vector: vector,
        payloadMb: payloadMB
      }));
    }

    function interceptArc(arcId) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'defend',
        actionType: 'bgp_null_route',
        arcId: arcId
      }));
    }

    function deployNodeShield() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const city = document.getElementById('shield-target-city').value;
      ws.send(JSON.stringify({
        type: 'defend',
        actionType: 'firewall_patch',
        targetCity: city
      }));
    }

    // 4. Update HUD and Terminal Matrix (Clean, Non-Glitching)
    let lastLogCount = 0;
    function renderWarRoomState(state) {
      if (!state) return;

      if (state.agentId && state.agentId !== selfAgentId) {
        selfAgentId = state.agentId;
        document.getElementById('agent-id-badge').innerText = `SENTINEL-${selfAgentId}`;
      }

      document.getElementById('defcon-val').innerText = state.threatLevel;
      document.getElementById('red-score').innerText = state.redScore;
      document.getElementById('blue-score').innerText = state.blueScore;
      document.getElementById('entropy-val').innerText = `${state.globalEntropy.toFixed(2)} H(X)`;
      document.getElementById('active-arcs-count').innerText = `${state.activeArcs.length} ARCS`;

      // Intercept list update
      const interceptContainer = document.getElementById('intercept-list');
      if (!state.activeArcs || state.activeArcs.length === 0) {
        interceptContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 10px;">Airspace clear. No active attack arcs.</div>';
      } else {
        // Deterministic stable sorting by ID to prevent DOM jumping
        const sortedArcs = [...state.activeArcs].sort((a, b) => (b.progress - a.progress) || a.id.localeCompare(b.id));
        interceptContainer.innerHTML = sortedArcs.map(arc => {
          return `
            <div class="threat-card" style="border-left-color: ${arc.color}">
              <div>
                <div style="font-weight: 700; color: ${arc.color};">${arc.vector}</div>
                <div style="color: var(--text-muted); font-size: 9px;">${arc.originCity} -> ${arc.targetCity} (${arc.payloadSize}MB)</div>
              </div>
              <div>
                ${arc.neutralized 
                  ? `<span style="color: var(--blue-team); font-weight: 700;">[NULL-ROUTED]</span>` 
                  : `<button class="intercept-action-btn" onclick="interceptArc('${arc.id}')">BGP NULL-ROUTE</button>`
                }
              </div>
            </div>
          `;
        }).join('');
      }

      // Terminal Logs Auto-scroll
      if (state.logs && state.logs.length !== lastLogCount) {
        lastLogCount = state.logs.length;
        const term = document.getElementById('terminal-stream');
        term.innerHTML = state.logs.map(l => {
          return `<div class="log-line log-${l.level}">[${l.timestamp}] [${l.tag}] ${l.message}</div>`;
        }).join('');
        term.scrollTop = term.scrollHeight;
      }
    }

    // 5. 60FPS Geodesic Ballistic Laser Arc Renderer
    function drawGeodesicArcs() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (warState && warState.nodes) {
        // Draw Target Infrastructure Nodes on Map
        warState.nodes.forEach(node => {
          const pt = map.project([node.coord.lng, node.coord.lat]);
          if (pt.x >= 0 && pt.x <= canvas.width && pt.y >= 0 && pt.y <= canvas.height) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, node.shield ? 9 : 5, 0, Math.PI * 2);
            ctx.fillStyle = node.shield ? 'rgba(0, 180, 216, 0.4)' : (node.health < 50 ? 'rgba(255, 42, 95, 0.5)' : 'rgba(0, 230, 118, 0.25)');
            ctx.fill();
            ctx.strokeStyle = node.shield ? '#00b4d8' : (node.health < 50 ? '#ff2a5f' : '#00e676');
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Clean Node Label
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '10px JetBrains Mono';
            ctx.fillText(`${node.city} [${node.health}%]`, pt.x + 8, pt.y + 3);
          }
        });
      }

      if (warState && warState.activeArcs) {
        warState.activeArcs.forEach(arc => {
          const startPt = map.project([arc.originCoord.lng, arc.originCoord.lat]);
          const targetPt = map.project([arc.targetCoord.lng, arc.targetCoord.lat]);
          const currentPt = map.project([arc.currentPos.lng, arc.currentPos.lat]);

          // Quadratic curved trajectory line
          const midX = (startPt.x + targetPt.x) / 2;
          const midY = (startPt.y + targetPt.y) / 2 - Math.min(100, Math.hypot(targetPt.x - startPt.x, targetPt.y - startPt.y) * 0.25);

          ctx.beginPath();
          ctx.moveTo(startPt.x, startPt.y);
          ctx.quadraticCurveTo(midX, midY, targetPt.x, targetPt.y);
          ctx.strokeStyle = arc.neutralized ? 'rgba(0, 180, 216, 0.3)' : (arc.color + '44');
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);

          // Glowing missile head particle at current progress
          ctx.beginPath();
          ctx.arc(currentPt.x, currentPt.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = arc.neutralized ? '#00b4d8' : arc.color;
          ctx.fill();
        });
      }

      requestAnimationFrame(drawGeodesicArcs);
    }

    map.on('load', () => {
      requestAnimationFrame(drawGeodesicArcs);
    });
  </script>
</body>
</html>
